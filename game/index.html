<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Thyme — Hearthfire Kitchen</title>
<style>
  html, body { margin: 0; padding: 0; background: #241708; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #f7e8c8; cursor: pointer; }
  #hint {
    margin: 0; padding: 10px 14px; box-sizing: border-box; width: 100%;
    color: #f3e2c2; background: #241708; text-align: center;
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
  }
  #hint b { color: #ffd54a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="hint">Mouse: click the stations &nbsp;·&nbsp; Keys: <b>1–6</b> grab an ingredient &nbsp;·&nbsp; <b>Tab / ← / →</b> move focus &nbsp;·&nbsp; <b>Enter</b> use &nbsp;·&nbsp; <b>S</b> serve &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
